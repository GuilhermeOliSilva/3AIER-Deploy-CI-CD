[pytest]
testpaths = tests
pythonpath = .
# integração chama a OpenAI de verdade: fica de fora do `pytest` padrão
addopts = -m "not integration" --strict-markers
# pirâmide de testes: unit (base) -> component -> integration (topo)
markers =
    unit: função isolada, sem I/O de rede (rodar com: pytest -m unit)
    component: loop/terminal do agente com cliente falso (rodar com: pytest -m component)
    integration: chama a API real da OpenAI (rodar com: pytest -m integration)
