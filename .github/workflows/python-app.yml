# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # permite rodar à mão (aba Actions) — é aí que o teste de integração roda
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      # sem chave: os testes usam um cliente falso e nunca chamam a OpenAI
      run: |
        pytest -v \
          --junitxml=reports/junit.xml \
          --html=reports/testes.html --self-contained-html \
          --cov=agent --cov-report=term-missing \
          --cov-report=html:reports/cobertura \
          --cov-report=xml:reports/coverage.xml \
          --cov-fail-under=90
    - name: Test summary
      # always(): o resumo aparece mesmo quando algum teste falha
      if: always()
      run: |
        python .github/scripts/resumo_testes.py reports/junit.xml reports/coverage.xml
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: relatorios-testes
        path: reports/
        retention-days: 30

  integration:
    # chama a API real (custa dinheiro): só quando disparado à mão
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Integration test with pytest
      run: |
        pytest -v -m integration \
          --junitxml=reports/junit.xml \
          --html=reports/integracao.html --self-contained-html
    - name: Test summary
      if: always()
      run: |
        python .github/scripts/resumo_testes.py reports/junit.xml
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: relatorios-integracao
        path: reports/
        retention-days: 30
