# Pirâmide de testes: cada arquivo de teste tem o seu próprio job, e cada
# camada só roda se a de baixo passou.
#
#   lint ─▶ unit (base) ─▶ component (meio) ─▶ integration (topo, manual)
#                 └──────────────┴──▶ cobertura (junta tudo e exige 90%)
#
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # permite rodar à mão (aba Actions) — é aí que o teste de integração roda
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/preparar
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # ========================================================================
  # 1. BASE DA PIRÂMIDE — testes unitários: funções isoladas, rápidos
  #    (sem chave: nenhum teste daqui chama a OpenAI)
  # ========================================================================

  unit-ferramentas:
    name: "Unit: ferramentas"
    needs: lint
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: reports/.coverage.unit-ferramentas
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/preparar
    - name: Test ferramentas
      run: |
        pytest -v -m unit tests/test_ferramentas.py \
          --junitxml=reports/junit.xml \
          --html=reports/testes.html --self-contained-html \
          --cov=agent --cov-report=
    - name: Test summary
      if: always()
      run: python .github/scripts/resumo_testes.py reports/junit.xml
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: 1-unit-ferramentas
        path: reports/
        include-hidden-files: true  # o .coverage.* é usado no job de cobertura
        retention-days: 30

  unit-contexto:
    name: "Unit: contexto"
    needs: lint
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: reports/.coverage.unit-contexto
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/preparar
    - name: Test contexto
      run: |
        pytest -v -m unit tests/test_contexto.py \
          --junitxml=reports/junit.xml \
          --html=reports/testes.html --self-contained-html \
          --cov=agent --cov-report=
    - name: Test summary
      if: always()
      run: python .github/scripts/resumo_testes.py reports/junit.xml
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: 1-unit-contexto
        path: reports/
        include-hidden-files: true
        retention-days: 30

  unit-prompts:
    name: "Unit: prompts"
    needs: lint
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: reports/.coverage.unit-prompts
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/preparar
    - name: Test prompts
      run: |
        pytest -v -m unit tests/test_prompts.py \
          --junitxml=reports/junit.xml \
          --html=reports/testes.html --self-contained-html \
          --cov=agent --cov-report=
    - name: Test summary
      if: always()
      run: python .github/scripts/resumo_testes.py reports/junit.xml
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: 1-unit-prompts
        path: reports/
        include-hidden-files: true
        retention-days: 30

  # ========================================================================
  # 2. MEIO DA PIRÂMIDE — testes de componente: o agente montado
  #    (loop e terminal) com o cliente falso. Só roda se TODOS os unit passaram.
  # ========================================================================

  component-loop:
    name: "Component: loop"
    needs: [unit-ferramentas, unit-contexto, unit-prompts]
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: reports/.coverage.component-loop
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/preparar
    - name: Test loop
      run: |
        pytest -v -m component tests/test_loop.py \
          --junitxml=reports/junit.xml \
          --html=reports/testes.html --self-contained-html \
          --cov=agent --cov-report=
    - name: Test summary
      if: always()
      run: python .github/scripts/resumo_testes.py reports/junit.xml
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: 2-component-loop
        path: reports/
        include-hidden-files: true
        retention-days: 30

  component-terminal:
    name: "Component: terminal"
    needs: [unit-ferramentas, unit-contexto, unit-prompts]
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: reports/.coverage.component-terminal
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/preparar
    - name: Test terminal
      run: |
        pytest -v -m component tests/test_terminal.py \
          --junitxml=reports/junit.xml \
          --html=reports/testes.html --self-contained-html \
          --cov=agent --cov-report=
    - name: Test summary
      if: always()
      run: python .github/scripts/resumo_testes.py reports/junit.xml
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: 2-component-terminal
        path: reports/
        include-hidden-files: true
        retention-days: 30

  # ========================================================================
  # COBERTURA — junta a cobertura de todos os jobs e exige no mínimo 90%
  # ========================================================================

  cobertura:
    name: Cobertura
    needs: [unit-ferramentas, unit-contexto, unit-prompts, component-loop, component-terminal]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/preparar
    - name: Download test reports
      uses: actions/download-artifact@v4
      with:
        pattern: "[12]-*"
        path: reports/
    - name: Combine coverage
      run: |
        coverage combine $(find reports -name '.coverage.*')
        coverage html -d reports/cobertura
        coverage xml -o reports/coverage.xml
        coverage report --show-missing --fail-under=90
    - name: Pyramid summary
      if: always()
      run: python .github/scripts/resumo_testes.py reports/*/junit.xml reports/coverage.xml
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cobertura
        path: |
          reports/cobertura/
          reports/coverage.xml
        retention-days: 30

  # ========================================================================
  # 3. TOPO DA PIRÂMIDE — integração com a API real da OpenAI
  #    Custa dinheiro: só roda quando disparado à mão (workflow_dispatch)
  # ========================================================================

  integration:
    name: "Integration: OpenAI"
    if: github.event_name == 'workflow_dispatch'
    needs: [component-loop, component-terminal]
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/preparar
    - name: Integration test with pytest
      run: |
        pytest -v -m integration tests/test_integracao.py \
          --junitxml=reports/junit.xml \
          --html=reports/integracao.html --self-contained-html
    - name: Test summary
      if: always()
      run: python .github/scripts/resumo_testes.py reports/junit.xml
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: 3-integration
        path: reports/
        retention-days: 30
